<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BusPass Chatbot</title>
<style>
body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;color:#1d2430}
header{background:#1d2430;color:#f2b705;padding:.8rem 1.2rem;border-bottom:6px solid #f2b705;font-size:1.4rem;font-weight:700}
main{max-width:520px;margin:1rem auto;padding:0 1rem}
#log{background:#fff;border:1px solid #dde1e7;border-radius:10px;height:55vh;overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:.5rem}
.b{margin:0;padding:.5rem .75rem;border-radius:10px;max-width:88%;white-space:pre-wrap}
.bot{background:#eef0f3;align-self:flex-start}.me{background:#1d2430;color:#fff;align-self:flex-end}
form{display:flex;gap:.5rem;margin-top:.6rem}input{flex:1;padding:.6rem;font:inherit;border:1px solid #aab1bd;border-radius:6px}
button{background:#f2b705;border:0;border-radius:6px;padding:0 1.1rem;font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}.chips button{background:#fff;border:1px solid #1d2430;border-radius:999px;padding:.25rem .7rem;font-weight:400}
</style></head><body>
<header>BusPass assistant</header>
<main>
<div id="log" role="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<form id="f"><input id="q" maxlength="300" placeholder="Type your question" aria-label="Your question" autocomplete="off"><button>Send</button></form>
</main>
<script>
const log=document.getElementById('log'),q=document.getElementById('q');
function add(t,c){const p=document.createElement('p');p.className='b '+c;p.textContent=t;log.appendChild(p);log.scrollTop=log.scrollHeight}
async function send(m){m=m.trim();if(!m)return;q.value='';add(m,'me');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
  const d=await r.json();add(r.ok?d.reply:(d.message||'Error'),'bot')}catch(e){add('Could not reach the server.','bot')}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send(q.value)};
['How do I book?','Show routes','Lost my ticket','Is my ticket safe?'].forEach(c=>{const b=document.createElement('button');b.type='button';b.textContent=c;b.onclick=()=>send(c);document.getElementById('chips').appendChild(b)});
add("Hi! I'm the BusPass assistant. Ask me about booking, fares, routes or your tickets.",'bot');
</script></body></html>
